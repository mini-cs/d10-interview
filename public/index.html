<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 면접 코치</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>AI 면접 코치 <small>개발 직군 신입</small></h1>

    <section id="start-screen">
      <form id="start-form" novalidate>
        <label>이름
          <input name="name" autocomplete="off">
        </label>
        <fieldset>
          <legend>트랙</legend>
          <label><input type="radio" name="track" value="frontend"> 프론트엔드</label>
          <label><input type="radio" name="track" value="backend"> 백엔드</label>
          <label><input type="radio" name="track" value="fullstack"> 풀스택</label>
        </fieldset>
        <label>회사
          <input name="company" value="클래스로" autocomplete="off">
        </label>
        <label>내 경험 <span class="hint">(30자 이상, 1000자 이내)</span>
          <textarea name="experience" rows="6" placeholder="프로젝트, 써 본 기술, 맡은 역할을 적어 주세요."></textarea>
        </label>
        <details id="posting-box">
          <summary>실제 회사 공고로 맞추기 (선택)</summary>
          <p class="hint">비워 두면 기본 공고 요약(신입 공고 3~4개)으로 출제해요. 원문은 키워드 정리에만 쓰고 저장하지 않아요.</p>
          <label>공고 원문 <span class="hint">(5000자 이내)</span>
            <textarea id="posting-text" rows="6" placeholder="지원할 회사의 채용 공고를 붙여 넣어 주세요."></textarea>
          </label>
          <button type="button" id="posting-summarize">키워드로 정리</button>
          <p class="waiting" id="posting-waiting" hidden></p>
          <p class="notice" id="posting-notice" role="alert"></p>
          <p class="hint">정리 결과를 확인하고 고쳐 주세요. 한 줄에 하나, 칸마다 6개 · 항목마다 30자까지. 직접 적어도 돼요.</p>
          <label>주요업무 <textarea data-posting="주요업무" rows="3"></textarea></label>
          <label>자격요건 <textarea data-posting="자격요건" rows="3"></textarea></label>
          <label>우대사항 <textarea data-posting="우대사항" rows="3"></textarea></label>
          <label>기술스택 <textarea data-posting="기술스택" rows="3"></textarea></label>
        </details>
        <p class="warn">실제 개인정보나 회사 기밀은 적지 마세요. (무료 등급은 보낸 내용이 Google 서비스 개선에 쓰일 수 있어요)</p>
        <p class="notice" id="start-notice" role="alert"></p>
        <button type="submit">면접 시작</button>
      </form>
    </section>

    <section id="interview-screen" hidden>
      <div class="status">
        <span id="status-track"></span>
        <span id="status-count"></span>
        <progress id="status-progress" max="5" value="0"></progress>
        <span>이해도 <strong id="status-understanding">-</strong></span>
        <button type="button" id="restart">처음부터 다시</button>
      </div>
      <div id="chat" aria-live="polite"></div>
      <p class="waiting" id="waiting" hidden></p>
      <p class="notice" id="chat-notice" role="alert"></p>
      <form id="answer-form" novalidate>
        <label for="answer" class="sr-only">내 답변</label>
        <textarea id="answer" name="answer" rows="4" placeholder="답변을 적어 주세요. (2000자 이내)"></textarea>
        <button type="submit">답변 보내기</button>
      </form>
    </section>

    <section id="eval-screen" hidden>
      <h2>평가</h2>
      <button type="button" id="eval-start">위원 4명에게 평가받기</button>
      <p class="waiting" id="eval-waiting" hidden></p>
      <div id="eval-results"></div>
      <button type="button" id="report-download" hidden>리포트 내려받기 (면접리포트.md)</button>

      <div id="retry-box" hidden>
        <h2>재도전</h2>
        <label for="retry-pick">다시 답할 질문 (점수 낮은 순)</label>
        <select id="retry-pick"></select>
        <p id="retry-info"></p>
        <label for="retry-answer" class="sr-only">다시 쓴 답</label>
        <textarea id="retry-answer" rows="5" placeholder="약한 점을 고쳐 다시 답해 주세요. (2000자 이내)"></textarea>
        <p class="notice" id="retry-notice" role="alert"></p>
        <button type="button" id="retry-submit">다시 채점</button>
        <p class="waiting" id="retry-waiting" hidden></p>
        <div id="retry-result"></div>
      </div>

      <div id="refine-box">
        <h2>마지막 질문 다듬기</h2>
        <label for="refine-answer">면접 마지막에 면접관에게 할 질문</label>
        <textarea id="refine-answer" rows="3" placeholder="예: 입사하면 어떤 일을 하게 되나요?"></textarea>
        <p class="notice" id="refine-notice" role="alert"></p>
        <button type="button" id="refine-submit">질문 다듬기</button>
        <p class="waiting" id="refine-waiting" hidden></p>
        <div id="refine-result"></div>
      </div>
    </section>
  </main>
</body>
</html>
